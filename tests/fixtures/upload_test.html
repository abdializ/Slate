<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Application Upload Test</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 30px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 400px; }
    button { padding: 8px 16px; background: #007aff; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Apply for Software Engineer</h2>
    <p>Upload your resume / CV (PDF, DOCX):</p>
    <input type="file" id="job-resume" name="resume" accept=".pdf,.docx,.txt">
    <div id="status" style="margin-top: 15px; font-weight: bold; color: green;">Ready</div>
  </div>
  <script>
    const input = document.getElementById('job-resume');
    input.addEventListener('change', () => {
      if (input.files.length > 0) {
        document.getElementById('status').innerText = 'Selected: ' + input.files[0].name;
      }
    });
  </script>
</body>
</html>

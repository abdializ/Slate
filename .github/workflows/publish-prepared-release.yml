name: Publish signed Slate update
on:
  push:
    branches: ['release/**']
    paths: ['.release/**']
permissions:
  contents: write
concurrency:
  group: slate-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test release branch cleanup guards
        run: python3 tests/release_cleanup_tests.py
      - name: Validate and publish the prepared update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-prepared-release.py
